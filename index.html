<!DOCTYPE html>
<head>
    <title>Listener</title>
</head>
<body>
    <iframe src="iframe.html" id="iFrame" title="iFrame"></iframe>
    <div class="log-area" id="logArea"></div>
    <script>
        const logElement = document.getElementById('logArea');

        window.addEventListener('message', function(event) {
            console.log('Text', event.data, event.origin);
            logElement.innerHTML = `${event.data}\n`;
        });
    </script>
</body>
</html>
